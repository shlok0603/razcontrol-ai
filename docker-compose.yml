services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: razcontrol-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: razcontrol
      POSTGRES_USER: razcontrol
      POSTGRES_PASSWORD: razcontrol

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U razcontrol -d razcontrol"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: razcontrol-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: